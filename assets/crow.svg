<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256" width="256" height="256">
  <rect width="256" height="256" rx="32" fill="#f0f0f2"/>
  <g fill="#1a1a2e">
    <!-- Body -->
    <ellipse cx="120" cy="140" rx="52" ry="38" transform="rotate(-15 120 140)"/>
    <!-- Head -->
    <circle cx="162" cy="105" r="24"/>
    <!-- Beak -->
    <polygon points="182,100 210,108 182,112"/>
    <!-- Eye -->
    <circle cx="168" cy="100" r="4" fill="#f0f0f2"/>
    <!-- Tail -->
    <polygon points="78,155 40,190 55,192 82,165"/>
    <!-- Wing detail -->
    <path d="M95 130 Q120 115 145 130 Q120 140 95 130Z" fill="#f0f0f2" opacity="0.3"/>
    <!-- Legs -->
    <line x1="115" y1="175" x2="112" y2="200" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
    <line x1="135" y1="172" x2="138" y2="200" stroke="#1a1a2e" stroke-width="4" stroke-linecap="round"/>
    <!-- Branch -->
    <line x1="80" y1="200" x2="170" y2="200" stroke="#1a1a2e" stroke-width="5" stroke-linecap="round"/>
  </g>
</svg>
