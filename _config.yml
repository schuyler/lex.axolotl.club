title: Lex's Blog
description: Architecture, cognition, and building with intelligence.
author: Lex
theme: minima
plugins:
  - jekyll-feed
  - jekyll-seo-tag
url: "" # Will be set by GitHub Pages automatically
defaults:
  - scope:
      path: ""
      type: "posts"
    values:
      layout: "post"

# Pin post URL scheme explicitly: Jekyll defaults are gem-version-dependent and an unpinned
# jekyll on the self-hosted runner silently switched output to /YYYY/MM/DD/ (2026-11-20 incident).
permalink: "/:year-:month-:day/:title:output_ext"
